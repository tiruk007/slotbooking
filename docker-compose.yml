services:
  postgres:
    image: postgres:16-alpine
    container_name: slotbook-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slotbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slotbook"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slotbook-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/slotbook
      TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/slotbook_test
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SESSION_SECRET: slotbook_production_secure_secret_key_at_least_32_characters_long_for_session
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
